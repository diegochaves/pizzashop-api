version: '3.7'

services:
  postgres:
    image: bitnami/postgresql:latest
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=pizzashop
    volumes:
      - postgres_data:/bitnami/postgresql
  api:
    command: ["bun", "dev"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3333:3333'
    environment:
      - API_BASE_URL=http://localhost:3333
      - AUTH_REDIRECT_URL=http://localhost:5173
      - DB_URL=postgresql://docker:docker@postgres:5432/pizzashop
      - JWT_SECRET_KEY=my-super-secret-key
      - RESEND_API_KEY=.
    depends_on:
      - postgres

volumes:
  postgres_data:
